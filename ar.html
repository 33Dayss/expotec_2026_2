<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câmera RA - Galeria</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <link rel="stylesheet" href="ar.css
    ">
</head>
<body>

    <a href="index.html" class="btn-voltar">Voltar para a Galeria</a>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        
        <a-entity mindar-image-target="targetIndex: 0">
            <a-plane color="#1a1a1a" position="0 -0.6 0" height="0.3" width="1" rotation="0 0 0">
                <a-text value="Vale Suspenso, 2024\nTecnica mista sobre tela." color="#cccccc" align="center" position="0 0 0.01" scale="0.4 0.4 0.4"></a-text>
            </a-plane>
            
            <a-box position="0 0 0.2" scale="0.5 0.5 0.5" color="#ffffff" animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></a-box>
        </a-entity>
        
    </a-scene>
</body>
</html>
