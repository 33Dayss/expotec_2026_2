<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câmera RA</title>
    <link rel="stylesheet" href="ar.css">
    
    <!-- Importa o A-Frame e o MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

    <!-- Botão de voltar -->
    <a href="index.html" class="btn-voltar">Voltar para o site</a>

    <!-- Cena de Realidade Aumentada -->
    <a-scene mindar-image="imageTargetSrc: ./marcador.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        
        <!-- O que aparece quando a imagem é reconhecida -->
        <a-entity mindar-image-target="targetIndex: 0">
            <!-- Um cubo vermelho de teste -->
            <a-box position="0 0 0" depth="0.5" height="0.5" width="0.5" color="red"></a-box>
        </a-entity>

    </a-scene>

</body>
</html>
